<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#201638">
<meta name="description" content="萬聖節魔法樂園｜學生魔法挑戰與管理者入口">
<title>萬聖節魔法樂園｜魔法入口</title>
<style>
:root{color-scheme:dark;--bg:#17102c;--panel:#302245;--line:#745990;--gold:#ffd278;--text:#fff9f0}
*{box-sizing:border-box}html{min-width:0}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at top,#54366c 0%,#261938 55%,var(--bg) 100%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{width:min(100% - 28px,760px);margin:auto;padding:clamp(24px,5vw,58px) 0 36px}
.hero{text-align:center}.eyebrow{letter-spacing:.13em;color:var(--gold);font-size:.84rem;font-weight:750}.art{font-size:clamp(3.6rem,12vw,6rem);line-height:1.3;margin:22px 0 10px}h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.25;margin:10px 0 14px}p{line-height:1.8;color:#e3d6ec;margin:0 auto 22px;max-width:55ch}
.card{border:1px solid var(--line);background:rgba(45,32,70,.92);padding:clamp(20px,5vw,38px);border-radius:24px;box-shadow:0 24px 65px #0e071a70}
.actions{display:grid;gap:16px;margin-top:24px}.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px;padding:14px 18px;border-radius:16px;text-decoration:none;text-align:center;font-size:clamp(1.05rem,3.7vw,1.25rem);font-weight:850;line-height:1.4;overflow-wrap:anywhere;transition:transform .15s,filter .15s}
.btn:focus-visible{outline:3px solid #fff;outline-offset:4px}.btn:active{transform:scale(.98)}.play{background:linear-gradient(125deg,#ffd879,#ffa753);color:#2d1b36}.admin{background:#534074;border:1px solid #a184c9;color:#fff}.hint{text-align:center;margin:18px auto 0;font-size:.88rem;color:#cfc0df}footer{text-align:center;color:#bcaed0;font-size:.82rem;margin-top:24px}
@media(hover:hover){.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}}
@media(max-width:360px){main{width:calc(100% - 20px)}.card{padding:18px}.art{margin-top:14px}.btn{min-height:56px}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
<header class="hero">
<div class="eyebrow">✦ HALLOWEEN MAGIC SCHOOL ✦</div>
<div class="art" aria-hidden="true">🌙 🏰 🎃</div>
<h1>萬聖節魔法樂園</h1>
<p>進入神祕城堡，挑戰魔法題目，收集糖果，成為萬聖節小巫師！</p>
</header>
<section class="card" aria-label="進入樂園">
<h2 style="text-align:center;margin:0;font-size:clamp(1.25rem,4vw,1.65rem)">✨ 選擇您的入口</h2>
<div class="actions">
<a class="btn play" href="https://script.google.com/macros/s/AKfycbyR9Qdc627WyFtawkQlEtKHxqqu2rKjvAUi2uHb46kkDNRgJMOB8tND9LFpOO-Yc7wIrg/exec">🎮 開始魔法冒險 <span aria-hidden="true">➜</span></a>
<a class="btn admin" href="https://script.google.com/macros/s/AKfycbyR9Qdc627WyFtawkQlEtKHxqqu2rKjvAUi2uHb46kkDNRgJMOB8tND9LFpOO-Yc7wIrg/exec?admin=1">🔐 管理者登入 <span aria-hidden="true">➜</span></a>
</div>
<p class="hint">學生請選「開始魔法冒險」；老師請選「管理者登入」。</p>
</section>
<footer>🎃 適用手機、平板、Chromebook 與電腦<br>本入口不蒐集姓名或密碼，驗證由 Google Apps Script 處理。</footer>
</main>
</body>
</html>
